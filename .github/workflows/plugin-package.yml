name: Build ChatGPT Plugin

on:
  workflow_dispatch:
    inputs:
      chatgpt_app_id:
        description: Existing ChatGPT App ID for the PersonalDB MCP
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installable plugin ZIP
        env:
          PERSONALDB_CHATGPT_APP_ID: ${{ inputs.chatgpt_app_id }}
        run: npm run plugin:build
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: personaldb-memory-chatgpt-plugin
          path: dist/personaldb-memory-plugin.zip
          if-no-files-found: error
