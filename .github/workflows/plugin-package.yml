name: Build ChatGPT Plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build installable plugin ZIP
        run: npm run plugin:build
      - name: Verify archive root
        run: |
          unzip -l dist/personaldb-memory-plugin.zip
          unzip -p dist/personaldb-memory-plugin.zip plugin.json >/dev/null
          unzip -p dist/personaldb-memory-plugin.zip mcp.json >/dev/null
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: personaldb-memory-chatgpt-plugin
          path: dist/personaldb-memory-plugin.zip
          if-no-files-found: error
