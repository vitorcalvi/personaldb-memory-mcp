name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refuse web plugin build without ChatGPT App ID
        run: |
          if npm run plugin:build; then
            echo "plugin:build unexpectedly succeeded without an App ID"
            exit 1
          fi
      - name: Validate ChatGPT plugin package
        env:
          PERSONALDB_CHATGPT_APP_ID: plugin_asdk_app_test_fixture
        run: npm run plugin:build
      - name: Validate complete source bundle
        run: npm run plugin:source
      - name: Local Wrangler integration + isolation test
        run: npm run local:smoke
